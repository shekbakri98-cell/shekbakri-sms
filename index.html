<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shek Bekri Sapalo Secondary School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background-color: #1e293b; padding: 40px; border: 1px solid #334155; width: 100%; max-width: 400px; border-radius: 12px; }
        .login-box h1 { text-align: center; color: #facc15; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 6px; background-color: #0f172a; border: 1px solid #475569; color: #fff; outline: none; }
        .btn-cyan { width: 100%; background-color: #06b6d4; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-nav { width: 100%; text-align: left; padding: 12px; border: none; background: none; color: #f8fafc; font-size: 1rem; cursor: pointer; }
        .btn-nav.active { color: #facc15; background-color: #1e293b; }
        .btn-logout { background-color: rgba(127, 29, 29, 0.4); color: #f87171; margin-top: 40px; padding: 12px; border-radius: 6px; text-align: center; cursor: pointer; }
        #appPage { display: none; flex-direction: column; flex: 1; }
        header { background-color: #0891b2; color: #0f172a; text-align: center; padding: 16px; font-weight: 900; }
        .app-container { display: flex; flex: 1; }
        nav { width: 260px; background-color: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        main { flex: 1; padding: 30px; overflow-y: auto; }
        .hidden { display: none !important; }
        .section-title { font-size: 1.75rem; color: #facc15; margin-bottom: 20px; padding-bottom: 10px; border-b: 1px solid #334155; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; padding: 24px; border-radius: 10px; border: 1px solid #334155; }
        .card h3 { font-size: 2.25rem; color: #22d3ee; margin-top: 8px; }
        .opt-btn { width: 100%; text-align: left; padding: 14px; background-color: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; cursor: pointer; margin-bottom: 8px; }
        .quiz-footer { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-action { padding: 10px 24px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginPage">
        <div class="login-box">
            <h1>WELCOM</h1>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" value="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" value="admin123">
            </div>
            <button type="button" onclick="kallattiinSeensi()" class="btn-cyan">Login</button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appPage">
        <header>
            Mana Barnoota Sheek Bakrii Saphaloo Sad.2ffaa (Shek Bekri Sapalo Secondary School)
        </header>

        <div class="app-container">
            <nav>
                <button id="nav-dashboard" onclick="showSection('dashboardSection')" class="btn-nav active">Dashboard</button>
                <button id="nav-student" onclick="showSection('studentRegSection')" class="btn-nav">Galmeessa Barataa</button>
                <button id="nav-teacher" onclick="showSection('teacherExamSection')" class="btn-nav">Foormii Barsiisaa</button>
                <button id="nav-exam" onclick="showSection('studentExamSection')" class="btn-nav">Qormaata Barataa</button>
                <div onclick="logout()" class="btn-logout">Cufi (Logout)</div>
            </nav>

            <main>
                <!-- DASHBOARD SECTION -->
                <section id="dashboardSection">
                    <h2 class="section-title">Dashboard Overview</h2>
                    <div class="grid-3">
                        <div class="card"><p>Waliigala Barattootaa</p><h3>124</h3></div>
                        <div class="card"><p>Dhiira</p><h3>68</h3></div>
                        <div class="card"><p>Dubara</p><h3>56</h3></div>
                    </div>
                </section>

                <!-- STUDENT REGISTRATION -->
                <section id="studentRegSection" class="hidden">
                    <div style="max-width: 500px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px;">
                        <h2 class="section-title">Galmeessa Barataa Haaraa</h2>
                        <div class="form-group"><label>ID Barataa</label><input type="text"></div>
                        <div class="form-group"><label>Maqaa Barataa</label><input type="text"></div>
                        <button onclick="alert('Barataan milkiidhaan galmeeffameera!')" class="btn-cyan" style="background:#eab308;">Save Barataa</button>
                    </div>
                </section>

                <!-- TEACHER QUESTION INPUT -->
                <section id="teacherExamSection" class="hidden">
                    <div style="max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px;">
                        <h2 class="section-title">Foormii Barsiisaa (Gaaffii Lixi)</h2>
                        <div class="form-group"><label>Gosa Barnootaa</label><input type="text"></div>
                        <div class="form-group"><label>Gaaffii Barreessi</label><textarea style="height:80px;"></textarea></div>
                        <div class="form-group"><label>Deebii Sirrii</label><input type="text" placeholder="A, B, C, ykn D"></div>
                        <button onclick="alert('Gaaffiin kuusameera!')" class="btn-cyan" style="background:#10b981;">Save Gaaffii</button>
                    </div>
                </section>

                <!-- STUDENT EXAM INTERFACE -->
                <section id="studentExamSection" class="hidden">
                    <div class="card" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                        <button onclick="document.getElementById('quizBox').classList.remove('hidden');" class="btn-cyan" style="width:auto; padding: 10px 30px;">Qormaata Jalqabi</button>
                        <div style="font-weight: bold; color: #facc15;">Yeroo: 20:00</div>
                    </div>
                    <div id="quizBox" class="card hidden">
                        <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 16px;">Gaaffii 1: Garaagarummaa maaliiti?</div>
                        <button onclick="alert('Ati A filatteetta.')" class="opt-btn">A. Filannoo Jalqabaa</button>
                        <button onclick="alert('Ati B filatteetta.')" class="opt-btn">B. Filannoo Lammaffaa</button>
                        <div class="quiz-footer">
                            <button class="btn-action" style="background:#16a34a;">Darbe</button>
                            <button class="btn-action" style="background:#ea580c;">Itti aanu</button>
                            <button onclick="alert('Xumurameera!'); document.getElementById('quizBox').classList.add('hidden');" class="btn-action" style="background:#dc2626;">Xumuri</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- JAVASCRIPT LOGICS -->
    <script>
        function kallattiinSeensi() {
            var u = document.getElementById('loginUser').value.trim();
            var p = document.getElementById('loginPass').value.trim();
            if(u === "admin" && p === "admin123") {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appPage').style.display = 'flex';
                showSection('dashboardSection');
            } else {
                alert("Username ykn Password dogoggora!");
            }
        }

        function showSection(id) {
            ['dashboardSection', 'studentRegSection', 'teacherExamSection', 'studentExamSection'].forEach(function(s) {
                var el = document.getElementById(s); if(el) el.classList.add('hidden');
            });
            var active = document.getElementById(id); if(active) active.classList.remove('hidden');
            
            var btns = document.querySelectorAll('nav .btn-nav');
            btns.forEach(function(b) { btn.classList.remove('active'); });
            
            var map = {'dashboardSection':'nav-dashboard','studentRegSection':'nav-student','teacherExamSection':'nav-teacher','studentExamSection':'nav-exam'};
            var activeBtn = document.getElementById(map[id]); if(activeBtn) activeBtn.classList.add('active');
        }

        function logout() {
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
        }
    </script>
</body>
</html>
