<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <title>Shek Bekri Sapalo School</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #7c5295; color: #fff; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background-color: #1e293b; padding: 40px; border: 1px solid #334155; width: 100%; max-width: 400px; border-radius: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 6px; background-color: #0f172a; border: 1px solid #475569; color: #fff; outline: none; }
        .btn-cyan { width: 100%; background-color: #06b6d4; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-nav { width: 100%; text-align: left; padding: 12px; border: none; background: none; color: #f8fafc; font-size: 1rem; cursor: pointer; }
        .btn-nav.active { color: #facc15; background-color: #1e293b; }
        #appPage { display: none; flex-direction: column; flex: 1; }
        header { background-color: #0891b2; color: #0f172a; text-align: center; padding: 16px; font-weight: 900; }
        .app-container { display: flex; flex: 1; }
        nav { width: 260px; background-color: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        main { flex: 1; padding: 30px; overflow-y: auto; }
        .hidden { display: none !important; }
        .section-title { font-size: 1.75rem; color: #facc15; margin-bottom: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; padding: 24px; border-radius: 10px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="login-box">
            <h1 style="text-align:center; color:#facc15; margin-bottom:20px;">WELCOM</h1>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" value="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" value="admin123">
            </div>
            <button type="button" onclick="kallattiinSeensi()" class="btn-cyan">Login</button>
        </div>
    </div>

    <div id="appPage">
        <header>Mana Barnoota Sheek Bakrii Saphaloo Sad.2ffaa</header>
        <div class="app-container">
            <nav>
                <button id="nav-dashboard" onclick="showSection('dashboardSection')" class="btn-nav active">Dashboard</button>
                <button id="nav-student" onclick="showSection('studentRegSection')" class="btn-nav">Galmeessa Barataa</button>
                <button id="nav-teacher" onclick="showSection('teacherExamSection')" class="btn-nav">Foormii Barsiisaa</button>
                <button id="nav-exam" onclick="showSection('studentExamSection')" class="btn-nav">Qormaata Barataa</button>
                <div onclick="logout()" style="background:rgba(220,38,38,0.2); color:#f87171; text-align:center; padding:10px; margin-top:30px; cursor:pointer; border-radius:6px;">Logout</div>
            </nav>
            <main>
                <section id="dashboardSection">
                    <h2 class="section-title">Dashboard Overview</h2>
                    <div class="grid-3">
                        <div class="card"><p>Waliigala Barattootaa</p><h3 style="font-size:2rem; color:#22d3ee; margin-top:10px;">124</h3></div>
                        <div class="card"><p>Dhiira</p><h3 style="font-size:2rem; color:#60a5fa; margin-top:10px;">68</h3></div>
                        <div class="card"><p>Dubara</p><h3 style="font-size:2rem; color:#f472b6; margin-top:10px;">56</h3></div>
                    </div>
                </section>
                <section id="studentRegSection" class="hidden">
                    <h2 class="section-title">Galmeessa Barataa</h2>
                    <div style="background:#1e293b; padding:20px; max-width:500px; border-radius:8px;">
                        <div class="form-group"><label>ID Barataa</label><input type="text"></div>
                        <div class="form-group"><label>Maqaa Barataa</label><input type="text"></div>
                        <button onclick="alert('Kuusameera!')" class="btn-cyan" style="background:#eab308; color:#000;">Save</button>
                    </div>
                </section>
                <section id="teacherExamSection" class="hidden">
                    <h2 class="section-title">Foormii Barsiisaa</h2>
                    <div style="background:#1e293b; padding:20px; max-width:500px; border-radius:8px;">
                        <div class="form-group"><label>Gosa Barnootaa</label><input type="text"></div>
                        <div class="form-group"><label>Gaaffii</label><input type="text"></div>
                        <button onclick="alert('Gaaffiin kuusameera!')" class="btn-cyan" style="background:#10b981; color:#000;">Save Gaaffii</button>
                    </div>
                </section>
                <section id="studentExamSection" class="hidden">
                    <h2 class="section-title">Qormaata Barataa</h2>
                    <p>Kutaan qormaataa asitti argama.</p>
                </section>
            </main>
        </div>
    </div>

    <script>
        function kallattiinSeensi() {
            var u = document.getElementById('loginUser').value.trim();
            var p = document.getElementById('loginPass').value.trim();
            if(u === "admin" && p === "admin123") {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appPage').style.display = 'flex';
                showSection('dashboardSection');
            } else {
                alert("Username ykn Password dogoggora!");
            }
        }
        function showSection(id) {
            ['dashboardSection', 'studentRegSection', 'teacherExamSection', 'studentExamSection'].forEach(function(s) {
                var el = document.getElementById(s); if(el) el.classList.add('hidden');
            });
            var active = document.getElementById(id); if(active) active.classList.remove('hidden');
            var btns = document.querySelectorAll('nav .btn-nav');
            btns.forEach(function(b) { b.classList.remove('active'); });
            var map = {'dashboardSection':'nav-dashboard','studentRegSection':'nav-student','teacherExamSection':'nav-teacher','studentExamSection':'nav-exam'};
            var activeBtn = document.getElementById(map[id]); if(activeBtn) activeBtn.classList.add('active');
        }
        function logout() {
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
        }
    </script>
</body>
</html>
