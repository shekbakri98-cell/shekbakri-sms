<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shek Bekri Sapalo Secondary School - Examination System</title>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #FFC107;
            --danger: #F44336;
            --dark: #006064;
            --purple: #7b1fa2;
            --light: #F8F9FA;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 30px;
        }
        .header {
            background-color: #006064;
            color: #00e5ff;
            padding: 25px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 6px solid var(--primary);
        }
        .content {
            padding: 30px;
        }
        .student-box {
            background: var(--purple);
            border-radius: 8px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
        }
        .student-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .student-box .form-group label {
            color: white;
        }
        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .btn-filter {
            background-color: #ffb300;
            color: black;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-filter:hover {
            background-color: #ffa000;
        }
        .timer-box {
            background-color: #263238;
            color: #ffeb3b;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            border-radius: 6px;
            margin: 25px 0;
            display: none;
            letter-spacing: 1px;
        }
        .quiz-section {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 6px solid var(--primary);
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            display: none;
        }
        .question-title {
            font-size: 19px;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-item {
            display: flex;
            align-items: center;
            background: white;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .option-item:hover {
            border-color: var(--primary);
            background: #f1f8e9;
        }
        .option-item input {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-action {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .btn-next { background-color: var(--primary); }
        .btn-next:hover { background-color: #43a047; }
        .btn-finish { background-color: var(--danger); }
        .btn-finish:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        Mana Barnoota Sheek Bakrii Saphaloo Sad.2ffaa (Shek Bekri Sapalo Secondary School)
    </div>
    
    <div class="content">
        <!-- Odeeffannoo Barataa -->
        <div class="student-box">
            <h3>Odeeffannoo Barataa</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>ID Barataa:</label>
                    <input type="number" id="idBarataa" placeholder="Fkn. 124">
                </div>
                <div class="form-group">
                    <label>Maqaa Barataa:</label>
                    <input type="text" id="txtMaqaaBarataa" placeholder="Maqaa Guutuu">
                </div>
            </div>
        </div>

        <!-- Calaltuu (Filters) -->
        <div class="grid-3">
            <div class="form-group">
                <label>Filadhu Kutaa:</label>
                <select id="cboKutaa">
                    <option value="">-- Kutaa --</option>
                    <option value="9">Kutaa 9</option>
                    <option value="10">Kutaa 10</option>
                    <option value="11">Kutaa 11</option>
                    <option value="12">Kutaa 12</option>
                </select>
            </div>
            <div class="form-group">
                <label>Gosa Barnootaa:</label>
                <select id="cboGosaBarnootaa">
                    <option value="">-- Barnoota --</option>
                    <option value="Afan_Oromo">Afaan Oromoo</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Physics">Physics</option>
                    <option value="English">English</option>
                </select>
            </div>
            <div class="form-group">
                <label>Gosa Qormaataa:</label>
                <select id="cboGosaQormaataa">
                    <option value="">-- Qormaata --</option>
                    <option value="Mid_Exam">Mid Exam</option>
                    <option value="Final_Exam">Final Exam</option>
                </select>
            </div>
        </div>

        <button class="btn-filter" onclick="gaaffiiFilterGodhi()">Qormaata Jalqabsiisi (Filter)</button>

        <!-- Lakkoofsa Sa'aatii (Timer) -->
        <div class="timer-box" id="timerBox">Yeroo Hafe: 20:00</div>

        <!-- Unka Gaaffilee Qormaataa -->
        <div class="quiz-section" id="quizSection">
            <h3 class="question-title" id="questionText">Gaaffii 1: ...</h3>
            <div class="options-list">
                <label class="option-item"><input type="radio" name="quizOption" value="A"> A. <span id="optA">Filannoo A</span></label>
                <label class="option-item"><input type="radio" name="quizOption" value="B"> B. <span id="optB">Filannoo B</span></label>
                <label class="option-item"><input type="radio" name="quizOption" value="C"> C. <span id="optC">Filannoo C</span></label>
                <label class="option-item"><input type="radio" name="quizOption" value="D"> D. <span id="optD">Filannoo D</span></label>
            </div>
            
            <div class="action-buttons">
                <button class="btn-action btn-next" onclick="btnIttiAanuClick()">Itti Aanu ➔</button>
                <button class="btn-action btn-finish" onclick="btnXumuriClick()">Xumuri ✖</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Fakkkeenya Data Gaaffilee (Database)
    const databaseGaaffilee = [
        { id: 1, kutaa: "9", barnoota: "Afan_Oromo", qormaata: "Mid_Exam", text: "Hiikni jecha 'Saphaloo' jedhu maali?", a: "Hayyuu", b: "Mataa / Goota", c: "Tulluu", d: "Haaraa" },
        { id: 2, kutaa: "9", barnoota: "Afan_Oromo", qormaata: "Mid_Exam", text: "Afaan Oromoo keessatti qubeewwan dubbifamtootni meeqa?", a: "26", b: "31", c: "5", d: "10" },
        { id: 3, kutaa: "10", barnoota: "Mathematics", qormaata: "Final_Exam", text: "Find x if 2x + 5 = 15.", a: "5", b: "10", c: "15", d: "2" }
    ];

    let filteredQuestions = [];
    let currentIdx = 0;
    let totalSeconds = 1200; 
    let timerInterval = null;
    let deebiiBarataaCollection = [];

    function gaaffiiFilterGodhi() {
        const idBarataa = document.getElementById('idBarataa').value;
        const maqaa = document.getElementById('txtMaqaaBarataa').value;
        const kutaa = document.getElementById('cboKutaa').value;
        const barnoota = document.getElementById('cboGosaBarnootaa').value;
        const qormaata = document.getElementById('cboGosaQormaataa').value;

        if(!idBarataa || !maqaa) {
            alert("Maaloo dursitanii ID fi Maqaa Barataa galchaa!");
            return;
        }

        // Ittisa Qormaata Dachaa
        let duraanFudhateera = localStorage.getItem(`fudhatame_${idBarataa}_${barnoota}`);
        if(duraanFudhateera) {
alert(Barataan kun qormaata '${barnoota}' kanaan dura fudhateera!);return;}// Calaluu (Filter)filteredQuestions = databaseGaaffilee.filter(q =>(kutaa === "" || q.kutaa === kutaa) &&(barnoota === "" || q.barnoota === barnoota) &&(qormaata === "" || q.qormaata === qormaata));if(filteredQuestions.length > 0) {currentIdx = 0;displayQuestion();document.getElementById('quizSection').style.display = 'block';document.getElementById('timerBox').style.display = 'block';// Timer Jalqabsiisi (Daqiiqaa 20)totalSeconds = 1200;clearInterval(timerInterval);timerInterval = setInterval(formTimer, 1000);} else {alert("Ulaagaa kanaan gaaffiin qophaa'e hin jiru!");document.getElementById('quizSection').style.display = 'none';document.getElementById('timerBox').style.display = 'none';}}function displayQuestion() {if(currentIdx < filteredQuestions.length) {const q = filteredQuestions[currentIdx];document.getElementById('questionText').innerText = Gaaffii ${currentIdx + 1}: ${q.text};document.getElementById('optA').innerText = q.a;document.getElementById('optB').innerText = q.b;document.getElementById('optC').innerText = q.c;document.getElementById('optD').innerText = q.d;const ele = document.getElementsByName("quizOption");for(let i=0;i<ele.length;i++) ele[i].checked = false;}}function btnIttiAanuClick() {const options = document.getElementsByName("quizOption");let selectedValue = null;for(let i=0; i<options.length; i++) {if(options[i].checked) selectedValue = options[i].value;}if(!selectedValue) {alert("Maaloo odoo gara gaaffii itti aanutti hin dabarre deebii filadhu!");return;}const idBarataa = document.getElementById('idBarataa').value;const currentQuestion = filteredQuestions[currentIdx];deebiiBarataaCollection.push({idBarataa: idBarataa,idGaaffii: currentQuestion.id,deebii: selectedValue});currentIdx++;if(currentIdx < filteredQuestions.length) {displayQuestion();} else {alert("Gaaffii dhumaa bira geessaniittu. Maaloo 'Xumuri' kan jedhu cuqaasaa!");}}function btnXumuriClick() {if(deebiiBarataaCollection.length === 0) {alert("Barataan kun gaaffii tokkollee hin deebisne!");return;}const idBarataa = document.getElementById('idBarataa').value;const barnoota = document.getElementById('cboGosaBarnootaa').value;localStorage.setItem(fudhatame_${idBarataa}_${barnoota}, "true");clearInterval(timerInterval);document.getElementById('quizSection').style.display = 'none';document.getElementById('timerBox').style.display = 'none';alert("Qormaanni keessan milkaa'inaan xumurameera!");console.log("Deebii kuusame:", deebiiBarataaCollection);}function formTimer() {totalSeconds--;let mins = Math.floor(totalSeconds / 60);let secs = totalSeconds % 60;secs = secs < 10 ? '0' + secs : secs;document.getElementById('timerBox').innerText = Yeroo Hafe: ${mins}:${secs};if(totalSeconds <= 0) {clearInterval(timerInterval);alert("Yeroon qormaataa xumurameera!");btnXumuriClick();}}
