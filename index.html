<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirna Bulchiinsa Mana Barnootaa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans pb-24">
    <header class="bg-purple-800 text-white p-5 shadow-lg text-center text-2xl font-bold tracking-wide">
        Unka Fudhadhu Qormaataa & Bulchiinsa Barataa
    </header>
    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-purple-600 lg:col-span-1">
            <h2 class="text-xl font-bold mb-4 text-purple-800 border-b pb-2">Galmeessa Barataa</h2>
            <form id="studentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ID Barataa</label>
                    <input type="text" id="studentId" required class="w-full p-2.5 border rounded-lg mt-1 focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Maqaa Barataa</label>
                    <input type="text" id="name" required class="w-full p-2.5 border rounded-lg mt-1 focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Kutaa</label>
                    <select id="grade" required class="w-full p-2.5 border rounded-lg mt-1 bg-white">
                        <option value="">Filadhu...</option>
                        <option value="9">Kutaa 9</option>
                        <option value="10">Kutaa 10</option>
                        <option value="11">Kutaa 11</option>
                        <option value="12">Kutaa 12</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Gosa Barnootaa</label>
                    <select id="subject" required class="w-full p-2.5 border rounded-lg mt-1 bg-white">
                        <option value="">Filadhu...</option>
                        <option value="Afan Oromo">Afaan Oromoo</option>
                        <option value="Mathematics">Herrega</option>
                        <option value="Physics">Fiiziksii</option>
                        <option value="Chemistry">Keemistrii</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Gosa Qormaataa</label>
                    <select id="examType" required class="w-full p-2.5 border rounded-lg mt-1 bg-white">
                        <option value="">Filadhu...</option>
                        <option value="Mid Exam">Qormaata Walakkaa (Mid)</option>
                        <option value="Final Exam">Qormaata Xumuraa (Final)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-purple-600 text-white p-3 rounded-lg font-bold hover:bg-purple-700 transition duration-200">Barataa Galmeessi</button>
            </form>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600 lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-blue-800 border-b pb-2">Barattoota Galmeeffaman</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 font-semibold">
                            <th class="p-3 border">ID Barataa</th>
                            <th class="p-3 border">Maqaa Barataa</th>
                            <th class="p-3 border">Kutaa</th>
                            <th class="p-3 border">Barnoota</th>
                            <th class="p-3 border">Gosa Qormaataa</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="text-gray-600"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="fixed bottom-0 left-0 right-0 bg-cyan-500 p-4 flex justify-center space-x-6 shadow-inner z-50">
        <button class="bg-green-500 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-green-600 transition">Gaaffii Darbe</button>
        <button class="bg-orange-500 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-orange-600 transition">Gaaffii Itti aanu</button>
        <button id="finishBtn" class="bg-red-600 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-red-700 transition">Xumuri</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
